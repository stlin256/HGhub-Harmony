name = "hghub-telemetry"
main = "src/index.js"
compatibility_date = "2026-06-01"
account_id = "3c4ca6657b57bd72ce62e0518e8aeb95"
workers_dev = true

# 可选：自定义域名（workers.dev 在国内可能不可达）
# routes = [
#   { pattern = "telemetry.example.com", custom_domain = true }
# ]

[[d1_databases]]
binding = "DB"
database_name = "hghub_telemetry"
database_id = "3b1e4007-fda5-4052-9fdd-29693985f735"

# 以下三个通过 `wrangler secret put` 配置，不写进仓库（仓库是公开的）：
#   HASH_SALT      必填，设备 ID / IP 的哈希盐（openssl rand -hex 32）
#   STATS_KEY      必填，/stats 查询口令
#   SHARED_SECRET  可选，配置后启用 HMAC 校验（当前客户端未实现，保持未配置）
