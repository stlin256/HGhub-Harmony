name: Deploy telemetry worker

on:
  push:
    branches: [harmony]
    paths:
      - 'telemetry-worker/**'
      - '.github/workflows/deploy-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-telemetry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: telemetry-worker
        run: npm ci || npm install

      - name: 单元测试
        working-directory: telemetry-worker
        run: npm test

      - name: 检查部署凭据
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 CLOUDFLARE_API_TOKEN，跳过部署（仅跑测试）"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 应用 D1 迁移
        if: steps.creds.outputs.ready == 'true'
        working-directory: telemetry-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute hghub_telemetry --remote --file=./schema.sql

      - name: 部署 Worker
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: telemetry-worker
          command: deploy

      - name: 冒烟检查
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          base="https://hghub-telemetry.stlin256.workers.dev"
          echo "health: $(curl -fsS -m 15 "$base/health")"
          echo "badge:  $(curl -fsS -m 15 "$base/badge")"
