name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成编译期服务器端点占位（真实 IP/端口/密钥不入库）
        run: node scripts/harmony/set-server.mjs --placeholder

      - name: ArkTS 静态检查（语法 / JSON5 / 资源引用 / 路由 / 导入 / 大文件）
        run: python3 scripts/check/arkts_lint.py

      - name: 版本号一致性（app.json5 / README badge / git tag）
        run: python3 scripts/check/version_sync.py

      - name: 敏感信息与危险 API 扫描
        run: python3 scripts/check/secrets_scan.py

      - name: 文档相对链接
        run: python3 scripts/check/docs_links.py

      - name: 代码规范（禁 any / console）
        run: |
          fail=0
          if grep -rn --include="*.ets" -E ":\s*any\b|<any>" harmony/entry/src/main/ets ; then
            echo "发现 any 类型"; fail=1
          fi
          if grep -rn --include="*.ets" -E "console\.(log|warn|error)" harmony/entry/src/main/ets ; then
            echo "发现 console 输出（应使用 hilog）"; fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "code conventions ok"

      - name: 超大文件（>8MB）
        run: |
          find . -path ./.git -prune -o -type f -size +8M -print > /tmp/big.txt
          if [ -s /tmp/big.txt ]; then
            echo "以下文件超过 8MB，请改用 Release 或 LFS："
            cat /tmp/big.txt
            exit 1
          fi
          echo "no oversized files"

      - name: 构建产物未入库
        run: |
          if find . -path ./.git -prune -o -type d \( -name build -o -name oh_modules -o -name .hvigor \) -print | grep -q .; then
            echo "发现构建产物目录，禁止入库"
            exit 1
          fi
          echo "no build artifacts"

      - name: 变体检查（禁止测试变体入库）
        run: python3 scripts/check/variant_check.py

      - name: 配置覆盖率检查（未注册常量即失败）
        run: python3 scripts/check/config_coverage.py --strict
